<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OC 폰 서랍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: a drawer of phones (library) → one phone on a stage with a slim control rail. The device itself is a fixed iOS-like world. */
:root{
  --bg:#e9ebf2; --panel:#ffffff; --ink:#1a1c25; --mute:#676c7e; --line:#d6d9e4; --sunk:#e1e4ee;
  --accent:#4f52c9; --accent-ink:#ffffff; --danger:#c93c3c; --ok:#2f8f5b;
  --f-ui:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-disp:"Gowun Batang","Nanum Myeongjo",serif;
  --f-phone:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","IBM Plex Sans KR","Malgun Gothic",sans-serif;
  /* device palette: deliberately fixed, like real iOS light mode */
  --ios-bg:#ffffff; --ios-grp:#f2f2f7; --ios-ink:#000000; --ios-sec:#8a8a8e; --ios-sep:#c6c6c8; --ios-blue:#007aff; --ios-bub:#e9e9eb; --ios-green:#34c759; --ios-red:#ff3b30;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13141a; --panel:#1d1f28; --ink:#eceef6; --mute:#9ba0b3; --line:#2d303d; --sunk:#262935;
  --accent:#9a9cff; --accent-ink:#14152a; --danger:#ff7676; --ok:#5fd093; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13141a; --panel:#1d1f28; --ink:#eceef6; --mute:#9ba0b3; --line:#2d303d; --sunk:#262935;
  --accent:#9a9cff; --accent-ink:#14152a; --danger:#ff7676; --ok:#5fd093; color-scheme:dark}

[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
html:has(body.in-phone),body.in-phone,body.in-phone #app{height:100%;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea,select{font:inherit;color:inherit}

/* ---------- shared controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn.row{width:100%;justify-content:space-between;margin-top:10px}
.btn.row.add{justify-content:center;border-style:dashed}

/* ---------- library ---------- */
.lib{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:40px 64px}
.lib-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:32px}
.eyebrow{margin:0 0 4px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.lib-head h1{font-family:var(--f-disp);font-size:clamp(30px,5vw,44px);line-height:1.15;margin:0;text-wrap:balance}
.lede{margin:8px 0 0;color:var(--mute);max-width:48ch}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:28px 22px}
.card{display:flex;flex-direction:column;gap:10px;min-width:0}
.mini{position:relative;aspect-ratio:9/19;width:100%;max-width:100%;border-radius:26px;border:6px solid #15161b;box-shadow:0 18px 30px -18px rgba(20,22,40,.55);overflow:hidden;color:#fff;display:flex;flex-direction:column;align-items:center;padding-top:22%;text-shadow:0 1px 8px rgba(0,0,0,.25);transition:transform .18s}
.mini:hover{transform:translateY(-3px)}
.mini.ink{color:#111;text-shadow:none}
.mini-date{font-size:12px;font-weight:600;font-family:var(--f-phone)}
.mini-time{font-size:44px;font-weight:700;line-height:1;font-family:var(--f-phone);font-variant-numeric:tabular-nums}
.mini::before{content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);width:34%;height:11px;border-radius:8px;background:#000}
.card-meta{display:flex;flex-direction:column;min-width:0}
.card-meta b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-meta span{font-size:13px;color:var(--mute)}
.card-acts{display:flex;flex-wrap:wrap;gap:6px}
.empty{grid-column:1/-1;border:1.5px dashed var(--line);border-radius:18px;padding:40px 24px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.sec{margin-bottom:44px}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.sec-head h2{font-family:var(--f-disp);font-size:24px;margin:0}
.sec-head p{margin:4px 0 0;color:var(--mute);font-size:14px;max-width:52ch}
.notice{margin:0 0 24px;padding:12px 14px;border-radius:12px;background:var(--sunk);color:var(--mute);font-size:14px}

/* ---------- studio (one phone) ---------- */
.studio{height:100%;display:flex;gap:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.rail{width:220px;flex:none;display:flex;flex-direction:column;gap:10px;min-width:0}
.rail-name{padding:6px 2px 4px}
.rail-name b{display:block;font-family:var(--f-disp);font-size:22px;line-height:1.25;overflow-wrap:anywhere}
.rail-name span{color:var(--mute);font-size:13px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:10px;padding:3px}
.seg button{border:0;background:none;border-radius:8px;padding:7px 0;font-weight:600;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hint{font-size:13px;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:4px 0 0}
.hint b{color:var(--ink)}
.hint ul{margin:6px 0 0;padding-left:18px}
.savestate{font-size:12px;color:var(--mute);min-height:18px}
.stage{flex:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
.pbox{position:relative;flex:none}
@media (max-width:760px){
  .studio{flex-direction:column;gap:10px;padding-block:10px}
  .rail{width:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px}
  .rail-name{display:none}
  .seg{flex:1;min-width:150px}
  .hint{display:none}
  .savestate{width:100%;min-height:0;order:9}
}

/* ---------- full-screen phone on small screens ---------- */
body.fullphone .studio{padding:0;gap:0}
body.fullphone .rail{padding:8px max(12px,env(safe-area-inset-left,0px)) 8px max(12px,env(safe-area-inset-right,0px))}
body.fullphone.viewer .rail{display:none}
body.fullphone .stage{align-items:flex-start;background:#000}
body.fullphone .phone{width:390px;height:844px;padding:0;border-radius:0;background:none;box-shadow:none}
body.fullphone .screen{border-radius:0}
body.fullphone.viewer{background:#000}

/* ---------- device frame ---------- */
.phone{position:absolute;top:0;left:0;width:414px;height:868px;transform-origin:0 0;border-radius:66px;background:#17171b;padding:12px;box-shadow:inset 0 0 0 2px #3b3b42,inset 0 0 0 5px #0b0b0d,0 40px 70px -30px rgba(15,16,35,.55)}
.screen{position:relative;width:390px;height:844px;border-radius:54px;overflow:hidden;background:#000;font-family:var(--f-phone);font-size:17px;line-height:1.35;color:var(--ios-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.screen button{background:none;border:0;padding:0;text-align:inherit}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#000;z-index:40;pointer-events:none}
.sb{position:absolute;inset:0 0 auto;height:54px;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 44px;color:#fff;font-weight:600;font-size:16px;z-index:35;pointer-events:none}
.sb.dk{color:#000}
.sb-r{display:flex;align-items:center;gap:6px}
.sb-car{font-size:14px;font-weight:600}
.bat{width:26px;height:12.5px;border:1.4px solid currentColor;border-radius:4px;padding:1.4px;position:relative;opacity:.95}
.bat::after{content:"";position:absolute;right:-3.6px;top:3.2px;width:1.8px;height:4px;border-radius:0 1px 1px 0;background:currentColor}
.bat i{display:block;height:100%;border-radius:1.6px;background:currentColor}
.homebar{position:absolute;left:0;right:0;bottom:0;height:28px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px!important;z-index:45}
.homebar i{width:134px;height:5px;border-radius:3px;background:#fff;display:block}
.homebar.dk i{background:#000}
.view{position:absolute;inset:0}

/* lock */
.lock{position:absolute;inset:0;color:#fff;display:flex;flex-direction:column;align-items:center;user-select:none;touch-action:none}
.lock.ink{color:#111}
.lock-clock{margin-top:76px;text-align:center;text-shadow:0 1px 12px rgba(0,0,0,.18)}
.lock.ink .lock-clock{text-shadow:none}
.lock-date{font-size:21px;font-weight:600}
.lock-time{font-size:96px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.notifs{margin-top:auto;width:100%;padding:0 10px 14px;display:flex;flex-direction:column;gap:8px}
.notif{width:100%;text-align:left!important;background:rgba(245,245,250,.72)!important;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#000;border-radius:20px;padding:12px 14px!important;font-size:15px}
.nt-h{display:flex;align-items:center;gap:7px;font-size:13px;color:#3c3c43}
.nt-h b{font-weight:600;color:#000;flex:1}
.nt-ic{width:20px;height:20px;border-radius:5px;background:linear-gradient(180deg,#67f27f,#25c541)}
.nt-t{font-weight:600;margin-top:4px}
.nt-b{color:#222;white-space:pre-wrap}
.lock-foot{width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 46px 46px}
.lk-btn{width:50px;height:50px;border-radius:50%;background:rgba(30,30,40,.35);backdrop-filter:blur(12px);display:grid;place-items:center;color:#fff}
.lock-hint{font-size:14px;font-weight:600;opacity:.92;color:inherit}
.edfab{position:absolute;z-index:30;left:50%;transform:translateX(-50%);top:270px;background:var(--ios-blue)!important;color:#fff!important;font-weight:600!important;font-size:15px;padding:9px 16px!important;border-radius:20px;box-shadow:0 6px 18px rgba(0,60,160,.35)}
.edfab.low{top:auto;bottom:118px}

/* passcode */
.pass{position:absolute;inset:0;color:#fff}
.pass-dim{position:absolute;inset:0;backdrop-filter:blur(26px) saturate(1.2);-webkit-backdrop-filter:blur(26px);background:rgba(20,20,30,.45)}
.pass-in{position:relative;display:flex;flex-direction:column;align-items:center;padding-top:120px;height:100%}
.pass-t{font-size:20px;font-weight:500}
.dots{display:flex;gap:22px;margin:20px 0 52px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff}
.dots i.on{background:#fff}
.keys{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px}
.key{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.2)!important;color:#fff;display:flex!important;flex-direction:column;align-items:center;justify-content:center;text-align:center!important}
.key:active{background:rgba(255,255,255,.45)!important}
.key b{font-size:34px;font-weight:400;line-height:1}
.key small{font-size:10px;letter-spacing:.18em;font-weight:600;margin-top:2px}
.key.z{grid-column:2}
.pass-foot{margin-top:auto;width:100%;display:flex;justify-content:space-between;padding:0 60px 60px;font-size:17px}
.pass-foot button{color:#fff}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}

/* home */
.home{position:absolute;inset:0;padding-top:64px;display:flex;flex-direction:column}
.home-in{flex:1;padding:10px 22px 0;display:flex;flex-direction:column;gap:22px;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 0;justify-items:center}
.appi{display:flex!important;flex-direction:column;align-items:center;gap:6px;width:76px}
.ic{width:62px;height:62px;border-radius:15px;display:grid;place-items:center;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.ic svg{width:100%;height:100%}
.ic img{width:100%;height:100%;object-fit:cover}
.al{font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35);max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.home.ink .al{color:#111;text-shadow:none}
.appi:active .ic{filter:brightness(.8)}
.dock{margin:0 12px 22px;padding:16px 14px;border-radius:32px;background:rgba(255,255,255,.28);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);display:flex;justify-content:space-around;min-height:94px}
.wd{border-radius:22px;height:156px;padding:16px 18px;overflow:hidden;position:relative;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.wd-clock{background:rgba(255,255,255,.88);color:#000;display:flex;flex-direction:column;justify-content:space-between}
.wd-clock small{color:var(--ios-red);font-weight:700;font-size:14px}
.wd-clock b{font-size:54px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.wd-text{background:#fffef4;color:#1c1c1e}
.wd-text small{display:block;color:#d9a400;font-weight:700;font-size:14px;margin-bottom:4px}
.wd-text p{margin:0;white-space:pre-wrap;font-size:15px;line-height:1.4}
.wd-photo{padding:0;background:#ccc}
.wd-photo img{width:100%;height:100%;object-fit:cover;display:block}

/* app chrome */
.app{position:absolute;inset:0;background:var(--ios-bg);display:flex;flex-direction:column;padding-top:54px}
.app.grp{background:var(--ios-grp)}
.nav{height:44px;flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px}
.nav>div:first-child{justify-self:start}
.nt{font-weight:600;font-size:17px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nr{justify-self:end;display:flex;gap:6px;align-items:center}
.nb{color:var(--ios-blue);font-size:17px;display:inline-flex!important;align-items:center;gap:5px;padding:6px 6px!important}
.nb svg{flex:none}
.nb.ed{font-size:14px;font-weight:600;background:rgba(0,122,255,.12)!important;border-radius:15px;padding:5px 11px!important}
.lt{font-size:34px;font-weight:700;margin:0;padding:0 16px 8px;letter-spacing:-.02em}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:40px;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.sbar{margin:0 16px 12px;background:rgba(118,118,128,.12);border-radius:10px;height:36px;display:flex;align-items:center;gap:6px;padding:0 10px;color:var(--ios-sec);font-size:17px}
.grpl{background:#fff;border-radius:12px;margin:0 16px 24px;overflow:hidden}
.app:not(.grp) .grpl{background:var(--ios-grp)}
.gh{margin:0 32px 6px;font-size:13px;color:var(--ios-sec);text-transform:uppercase}
.gr{display:flex!important;align-items:center;gap:12px;min-height:46px;padding:8px 16px!important;width:100%;text-align:left!important;position:relative;font-size:17px}
.gr+.gr::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--ios-sep)}
.gr .gv{margin-left:auto;color:var(--ios-sec);font-size:16px;display:flex;align-items:center;gap:6px;min-width:0;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gr .gi{width:30px;height:30px;border-radius:7px;flex:none;overflow:hidden;display:grid;place-items:center}
.gr .gi svg{width:100%;height:100%}
.chev{color:#c4c4c7;flex:none}
.empty-in{padding:60px 30px;text-align:center;color:var(--ios-sec);font-size:15px}
.empty-in b{display:block;color:#000;font-size:20px;margin-bottom:6px}
.edhint{margin:0 16px 16px;padding:10px 12px;border-radius:12px;background:rgba(0,122,255,.08);color:#0a4fa8;font-size:13px;line-height:1.45}

/* avatar */
.av{border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:600;overflow:hidden;background:linear-gradient(180deg,#a8adb6,#858a93)}
.av img{width:100%;height:100%;object-fit:cover}

/* messages */
.tl-row{display:flex!important;gap:12px;align-items:center;padding:8px 16px!important;width:100%;text-align:left!important;position:relative}
.tl-mid{flex:1;min-width:0;padding:4px 0 10px;border-bottom:.5px solid var(--ios-sep)}
.tl-top{display:flex;justify-content:space-between;gap:8px}
.tl-top b{font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-top span{color:var(--ios-sec);font-size:15px;white-space:nowrap}
.tl-prev{color:var(--ios-sec);font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3;margin-top:1px}
.pin-dot{position:absolute;left:5px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--ios-blue)}
.chat{background:#fff}
.chat-head{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px 6px;border-bottom:.5px solid var(--ios-sep);background:rgba(249,249,249,.94)}
.ch-who{display:flex!important;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:#000}
.ch-who span{display:flex;align-items:center;gap:2px}
.chatlog{padding:10px 12px 16px;display:flex;flex-direction:column;gap:2px}
.cdate{align-self:center;font-size:12px;color:var(--ios-sec);margin:12px 0 6px;font-weight:500;padding:0 6px!important;border-radius:6px}
.brow{display:flex;flex-direction:column}
.brow.me{align-items:flex-end}
.brow.them{align-items:flex-start}
.bub{max-width:262px;padding:7px 13px!important;border-radius:19px;font-size:17px;line-height:1.3;white-space:pre-wrap;overflow-wrap:anywhere;text-align:left!important;position:relative}
.me .bub{background:var(--ios-blue)!important;color:#fff}
.them .bub{background:var(--ios-bub)!important;color:#000}
.bub.pic{padding:0!important;background:none!important;overflow:hidden}
.bub img{display:block;max-width:220px;max-height:280px;border-radius:16px;object-fit:cover}
.bub.pic img{border-radius:18px}
.bub img+span{display:block;margin-top:6px}
.brow.end{margin-bottom:8px}
.btime{font-size:11px;color:var(--ios-sec);margin:2px 6px 0}
.bub.ed-on{outline:1.5px dashed rgba(0,122,255,.5);outline-offset:2px}
.typing{display:flex;gap:4px;padding:12px 14px;background:var(--ios-bub);border-radius:19px;width:max-content}
.typing i{width:8px;height:8px;border-radius:50%;background:#9a9aa0;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.tempnote{align-self:center;margin-top:10px;font-size:12px;color:var(--ios-sec);display:flex;gap:6px;align-items:center}
.tempnote button{color:var(--ios-blue);font-size:12px;font-weight:600}
.readmark{align-self:flex-end;font-size:11px;color:var(--ios-sec);margin:1px 6px 4px}
.composer{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px 36px;background:rgba(249,249,249,.94);border-top:.5px solid var(--ios-sep)}
.composer input{flex:1;min-width:0;height:36px;border:1px solid #c7c7cc;border-radius:18px;padding:0 14px;font-size:16px;background:#fff;outline:none}
.send{width:32px;height:32px;border-radius:50%;background:var(--ios-blue)!important;color:#fff;display:grid!important;place-items:center;flex:none}
.plus{width:32px;height:32px;border-radius:50%;background:#e5e5ea!important;color:#555;font-size:22px;line-height:1;display:grid!important;place-items:center;flex:none}
.who{display:flex;background:#e5e5ea;border-radius:9px;padding:2px;flex:none}
.who button{font-size:13px;font-weight:600;padding:5px 8px!important;border-radius:7px;color:#555}
.who button.on{background:#fff;color:#000;box-shadow:0 1px 2px rgba(0,0,0,.15)}

/* photos */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.pt{aspect-ratio:1;position:relative;overflow:hidden;background:#e4e4e8!important;display:block!important;width:100%}
.pt img{width:100%;height:100%;object-fit:cover;display:block}

/* ---------------- saving ---------------- */
let saveTimer=null, saving=false, dirty=false;
function setSaveState(t){const el=$('#savestate');if(el)el.textContent=t;}
function commit(){ if(!P) return; P.updatedAt=Date.now(); scheduleSave(); renderScreen(); renderRail(); }
function touch(){ if(!P) return; P.updatedAt=Date.now(); scheduleSave(); }
function scheduleSave(){
 if(isLocal(PID)){ clearTimeout(saveTimer); setSaveState('저장 중…'); saveTimer=setTimeout(()=>{ LOCALP[PID]=clone(P); setSaveState(persistLocal()?'이 브라우저에 저장됨':(STORE_OK?'저장 실패':'이 브라우저는 저장을 막아 두었어요')); },500); return; }
 if(!DB||!canWrite||!PID) return;
 dirty=true; setSaveState('저장 중…'); clearTimeout(saveTimer); saveTimer=setTimeout(flush,700);
}
async function flush(){
 if(saving){clearTimeout(saveTimer);saveTimer=setTimeout(flush,400);return;}
 const body=clone(P); const js=JSON.stringify(body);
 if(js.length>250000){setSaveState('저장 안 됨');toast('이 휴대폰에 담긴 내용이 너무 많아서 저장하지 못했어요. 긴 글이나 사진을 조금 줄여 주세요.');dirty=false;return;}
 saving=true;
 try{ await DB.doc('phones/'+PID).set(body); lastSaved=js; dirty=false; setSaveState('저장됨'); }
 catch(e){
  dirty=false; setSaveState('저장 실패');
  if(e&&e.code==='invalid_argument'){canWrite=false;editMode=false;toast('이 휴대폰을 수정할 권한이 없어요. 보기 모드로 바꿨어요.');renderRail();renderScreen();}
  else if(e&&e.code==='quota_exceeded') toast('저장 공간이 가득 찼어요. 쓰지 않는 휴대폰을 지워 주세요.');
  else toast('저장하지 못했어요. 잠시 뒤 다시 바꿔 보세요.');
 }finally{saving=false;}
}

let pickCb=null;
function pick(cb,multiple){pickCb=cb;const f=$('#filepick');f.multiple=!!multiple;f.click();}
$('#filepick').addEventListener('change',async e=>{const files=[...e.target.files];e.target.value='';if(files.length&&pickCb)pickCb(files);});
function shrink(file,max,q){return new Promise(res=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res(b),'image/jpeg',q);};img.onerror=()=>{URL.revokeObjectURL(u);res(null);};img.src=u;});}
const blobToData=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b);});
async function uploadImage(file){
 if(ASSETS&&!isLocal(PID)){
  let blob=file;
  if(file.type!=='image/gif'&&file.size>3.5e6){const s=await shrink(file,2200,.88);if(s)blob=s;}
  try{const r=await ASSETS.upload(blob,blob.type?undefined:{type:'image/jpeg'});return 'a:'+r.id;}
  catch(e){
   if(e&&e.code==='too_large')toast('사진이 너무 커요. 20MB보다 작은 사진을 골라 주세요.');
   else if(e&&e.code==='unsupported_type')toast('이 형식의 사진은 올릴 수 없어요. JPG나 PNG로 골라 주세요.');
   else if(e&&e.code==='quota_or_state')toast('사진 저장 공간이 가득 찼어요.');
   else toast('사진을 올리지 못했어요. 다시 시도해 주세요.');
   return null;
  }
 }
 if(!editable()) return null;
 let b=await shrink(file,720,.78); if(!b){toast('사진을 읽지 못했어요.');return null;}
 if(b.size>70000) b=await shrink(file,520,.7);
 return await blobToData(b);
}

function saveBlob(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000); }
const safeName=n=>String(n||'phone').replace(/[\\/:*?"<>|]/g,'_').trim()||'phone';
function b64u(bytes){let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function unb64u(str){const bin=atob(str.replace(/-/g,'+').replace(/_/g,'/'));const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out;}
async function packPhone(d){
 const bytes=new TextEncoder().encode(JSON.stringify(d));
 if(window.CompressionStream){ try{ const st=new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate')); return 'v1.'+b64u(new Uint8Array(await new Response(st).arrayBuffer())); }catch(e){} }
 return 'v0.'+b64u(bytes);
}
async function unpackPhone(h){
 let bytes=unb64u(h.slice(3));
 if(h.startsWith('v1.')){ const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate')); bytes=new Uint8Array(await new Response(st).arrayBuffer()); }
 return JSON.parse(new TextDecoder().decode(bytes));
}
function stripLocalImages(o){ let n=0; const walk=x=>{ if(Array.isArray(x)) x.forEach((v,i)=>{ if(typeof v==='string'&&v.startsWith('data:')){x[i]='';n++;} else if(v&&typeof v==='object') walk(v); }); else for(const k in x){ const v=x[k]; if(typeof v==='string'&&v.startsWith('data:')){x[k]='';n++;} else if(v&&typeof v==='object') walk(v); } }; walk(o); return n; }
async function makeViewLink(d){
 const data=clone(d); const dropped=stripLocalImages(data);
 const base=location.href.split('#')[0];
 const url=base+'#'+(await packPhone(data));
 const online=/^https?:/.test(location.protocol);
 pushSheet({title:'보기 전용 링크',html:()=>`
  ${online?'':'<p class="sh-note">지금은 사이트가 아닌 파일로 열려 있어서 이 링크는 다른 사람에게 열리지 않아요. GitHub Pages에 올린 주소에서 다시 만들어 주세요.</p>'}
  <p class="sh-note">이 링크를 열면 휴대폰이 보기 전용으로 실행돼요. 고치거나 새로 만들 수는 없어요. 휴대폰 내용이 링크 안에 담겨 있어서, 나중에 내용을 바꾸면 링크를 새로 만들어 보내야 해요.${dropped?`\n\n직접 올린 사진 ${dropped}장은 너무 커서 링크에 담지 못하고 빠졌어요. 링크에서도 사진이 보이게 하려면 사진을 고를 때 ‘주소로 넣기’로 인터넷에 올린 사진 주소를 넣어 주세요.`:''}</p>
  <div class="fld"><label for="linkbox">링크 (${url.length.toLocaleString()}자)</label><textarea class="linkbox" id="linkbox" rows="4" readonly>${esc(url)}</textarea></div>
  <div class="menu"><button class="btn primary row" style="justify-content:center" data-a="copyView">링크 복사</button>${navigator.share?'<button class="btn row" style="justify-content:center" data-a="shareView">다른 앱으로 보내기</button>':''}<a class="btn row" style="justify-content:center;text-decoration:none" href="${esc(url)}" target="_blank" rel="noopener">새 창에서 열어 보기</a></div>`,
  url,name:d.name});
}

let SHEETS=[];
function pushSheet(s){ if(SHEETS.length) { const top=SHEETS[SHEETS.length-1]; if(top.collect) top.st=top.collect(); } SHEETS.push(s); drawSheet(); }
function popSheet(n=1){ SHEETS.splice(-n,n); drawSheet(); }
function closeSheets(){ SHEETS=[]; drawSheet(); }
function drawSheet(){
 const el=$('#sheet');
 if(!SHEETS.length){el.hidden=true;el.innerHTML='';applyPending();return;}
 const s=SHEETS[SHEETS.length-1];
 el.hidden=false;
 el.innerHTML=`<div class="sh-back" data-a="shCancel"></div><div class="sh" role="dialog" aria-modal="true" aria-label="${esc(s.title)}">
  <div class="sh-head"><button class="btn ghost sm" data-a="shCancel">${SHEETS.length>1?'‹ 뒤로':'닫기'}</button><h2>${esc(s.title)}</h2>${s.save?'<button class="btn primary sm" data-a="shSave">저장</button>':'<span></span>'}</div>
  <div class="sh-body">${s.html()}</div></div>`;
 const first=el.querySelector('.sh-body input:not([type=hidden]),.sh-body textarea');
 if(first&&s.autofocus) first.focus();
}
function fieldHtml(f,v){
 const id='f_'+f.k, lab=`<label for="${id}">${esc(f.l)}</label>`, help=f.h?`<small>${esc(f.h)}</small>`:'';
 if(f.t==='textarea') return `<div class="fld">${lab}<textarea id="${id}" rows="${f.rows||4}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>${help}</div>`;
 if(f.t==='select') return `<div class="fld">${lab}<select id="${id}">${f.o.map(([ov,ol])=>`<option value="${esc(ov)}" ${String(ov)===String(v)?'selected':''}>${esc(ol)}</option>`).join('')}</select>${help}</div>`;
 if(f.t==='toggle') return `<div class="fld tog"><label for="${id}">${esc(f.l)}</label><input type="checkbox" id="${id}" ${v?'checked':''}></div>${help?`<div class="fld">${help}</div>`:''}`;
 if(f.t==='number') return `<div class="fld">${lab}<input type="number" id="${id}" value="${esc(v)}" ${f.min!=null?`min="${f.min}"`:''} ${f.max!=null?`max="${f.max}"`:''} step="${f.step||1}">${help}</div>`;
 if(f.t==='image'||f.t==='wall'||f.t==='bg'){
  return `<div class="fld"><label>${esc(f.l)}</label><input type="hidden" id="${id}" value="${esc(v||'')}">
   <div class="imgf"><div class="imgprev ${f.t==='wall'?'wall':''}" id="pv_${f.k}" data-t="${f.t}" style="background:${esc(prevCss(f.t,v))}"></div>
   <div class="imgbtns"><button type="button" class="btn sm" data-a="pickImg" data-k="${f.k}">사진 고르기</button>${STANDALONE?`<button type="button" class="btn sm ghost" data-a="urlImg" data-k="${f.k}">주소로 넣기</button>`:''}${f.t==='image'?`<button type="button" class="btn sm ghost" data-a="clearImg" data-k="${f.k}">지우기</button>`:''}</div></div>
   ${f.t!=='image'?`<div class="swatches">${GRADS.map((g,i)=>`<button type="button" class="sw" data-a="setSw" data-k="${f.k}" data-v="g:${i}" style="background:${g}" aria-label="배경 ${i+1}"></button>`).join('')}${f.t==='bg'?`<input type="color" class="cpick" data-k="${f.k}" aria-label="색 직접 고르기">`:''}</div>`:''}${help}</div>`;
 }
 return `<div class="fld">${lab}<input type="text" id="${id}" value="${esc(v)}" placeholder="${esc(f.ph||'')}" ${f.num?'inputmode="numeric"':''} ${f.max?`maxlength="${f.max}"`:''}>${help}</div>`;
}
function prevCss(t,v){ if(t==='image') return v?`center/cover no-repeat url("${src(v)}")`:'var(--sunk)'; return bgCss(v,'var(--sunk)'); }
function setFieldVal(k,v){const i=$('#f_'+k);if(!i)return;i.value=v;const p=$('#pv_'+k);if(p)p.style.background=prevCss(p.dataset.t,v);}
function openForm({title,fields,values={},onSave,onDelete,extra=[],note,deleteLabel='삭제',autofocus}){
 const s={title,save:true,st:{...values},autofocus,
  html(){return `${note?`<p class="sh-note">${esc(note)}</p>`:''}${fields.map(f=>fieldHtml(f,this.st[f.k])).join('')}${extra.map((x,i)=>`<button type="button" class="btn row" data-a="shExtra" data-i="${i}">${esc(typeof x.label==='function'?x.label():x.label)} <span aria-hidden="true">›</span></button>`).join('')}${onDelete?`<button type="button" class="btn row danger" data-a="shDelete">${esc(deleteLabel)}</button>`:''}`;},
  collect(){const out={...this.st};fields.forEach(f=>{const el=$('#f_'+f.k);if(!el)return;if(f.t==='toggle')out[f.k]=el.checked;else if(f.t==='number')out[f.k]=el.value===''?0:Number(el.value);else out[f.k]=el.value;});return out;},
  doSave(){const v=this.collect();if(onSave(v)!==false){popSheet();commit();}},
  extra,onDelete,deleteLabel};
 pushSheet(s);
}
function openConfirm(title,msg,label,fn){
 pushSheet({title,html:()=>`<p class="sh-note">${esc(msg)}</p><button class="btn row danger" data-a="shYes" style="justify-content:center">${esc(label)}</button>`,yes:fn});
}
function openList({title,get,label,sub,onEdit,onAdd,addLabel,note}){
 pushSheet({title,html(){const items=get();return `${note?`<p class="sh-note">${esc(note)}</p>`:''}<div class="le">${items.map((it,i)=>`<div class="le-row"><button class="le-main" data-a="leEdit" data-i="${i}"><b>${esc(label(it)||'(비어 있음)')}</b>${sub?`<span>${esc(sub(it))}</span>`:''}</button><button class="ib" data-a="leMove" data-i="${i}" data-d="-1" aria-label="위로" ${i===0?'disabled':''}>↑</button><button class="ib" data-a="leMove" data-i="${i}" data-d="1" aria-label="아래로" ${i===items.length-1?'disabled':''}>↓</button></div>`).join('')||'<p class="sh-empty">아직 없어요.</p>'}</div>${onAdd?`<button class="btn row add" data-a="leAdd">+ ${esc(addLabel||'추가')}</button>`:''}`;},
  get,onEdit,onAdd});
}

function chatLog(t){

 let h='';
 arr.forEach((m,i)=>{
  if(m.date){h+=`<button class="cdate" ${editMode?`data-a="editMsg" data-t="${t.id}" data-id="${m.id}"`:''}>${esc(m.text)}</button>`;return;}
  const nx=arr[i+1];const end=!nx||nx.date||nx.me!==m.me;const saved=i<tempStart;
  h+=`<div class="brow ${m.me?'me':'them'} ${end?'end':''}"><button class="bub ${m.img&&!m.text?'pic':''} ${editMode?'ed-on':''}" ${editMode&&saved?`data-a="editMsg" data-t="${t.id}" data-id="${m.id}"`:''}>${m.img?`<img src="${esc(src(m.img))}" alt="">`:''}${m.text?`<span>${esc(m.text)}</span>`:''}</button>${end&&m.time?`<span class="btime">${esc(m.time)}</span>`:''}</div>`;
  if(!editMode&&T.readUpTo[t.id]===m.id) h+='<span class="readmark">읽음</span>';
 });
 if(!editMode&&T.typing===t.id) h+='<div class="brow them"><div class="typing"><i></i><i></i><i></i></div></div>';

 const html=fn(r); const r2=cur();
 const dark=!(T.call&&!editMode)&&DARKBAR.has(r2.s)||((r2.s==='lock'||r2.s==='pass')&&P.lock.clock==='dark'&&r2.s==='lock')||(r2.s==='home'&&P.home.ink);
 sc.innerHTML=`<div class="sb ${dark?'dk':''}"><span>${r2.s==='lock'||r2.s==='pass'?esc(P.status.carrier):esc(P.lock.time)}</span><span class="sb-r">${r2.s==='lock'||r2.s==='pass'?'':`<span class="sb-car">${esc(P.status.carrier)}</span>`}${SV.sig}${SV.wifi}<span class="bat"><i style="width:${Math.max(4,Math.min(100,+P.status.battery||0))}%"></i></span></span></div><div class="island"></div><div class="view">${html}</div><button class="homebar ${dark?'dk':''}" data-a="home" aria-label="홈으로"><i></i></button>`;

function fit(){const st=$('#stage'),pb=$('#pbox'),ph=$('#phone');document.body.classList.toggle('fullphone',window.innerWidth<=560);document.body.classList.toggle('viewer',!!VIEWER);if(!st||!pb)return;const full=document.body.classList.contains('fullphone');const W=full?390:414,H=full?844:868;const s=Math.max(.3,Math.min(st.clientWidth/W,st.clientHeight/H,full?2:1.1));ph.style.transform=`scale(${s})`;pb.style.width=W*s+'px';pb.style.height=H*s+'px';}
new ResizeObserver(()=>fit()).observe(document.documentElement);
window.addEventListener('resize',fit);

 if(unsubPhone){unsubPhone();unsubPhone=null;}

  if(!snap.exists){ if(!P){ $('#app').innerHTML=`<main class="lib"><div class="empty"><b>휴대폰을 찾을 수 없어요</b>지워졌거나 주소가 잘못됐어요.<br><br><button class="btn" data-a="toList">휴대폰 서랍으로</button></div></main>`; } return; }
  const d=snap.data(); const js=JSON.stringify(d);
  if(!P){ lastSaved=js; P=normalize(clone(d)); render(); return; }
  if(dirty||saving||js===lastSaved) return;
  pendingRemote=js; applyPending();
 },()=>{});
}
function applyPending(){
 if(!pendingRemote||!P) return;

}

/* ---------------- auto reply ---------------- */
function matchRule(t,text){
 const n=norm(text);
 for(const r of t.rules||[]){const keys=String(r.keys||'').split(',').map(norm).filter(Boolean);if(keys.some(k=>r.exact?n===k:n.includes(k)))return r;}
 if((t.fallback||'').trim()) return {reply:t.fallback,delay:2};
 return null;
}
function sendTemp(t,text){
 const arr=T.chats[t.id]||(T.chats[t.id]=[]);const time=timeLabel(P.lock.time);
 const my={id:uid(),me:true,text,img:'',time};arr.push(my);renderChatLog();
 const r=matchRule(t,text); if(!r) return;
 if(r.kind==='call'){ const w=Math.max(.4,Number(r.delay)||1.5)*1000; setTimeout(()=>{T.readUpTo[t.id]=my.id;if(cur().id===t.id)renderChatLog();},Math.min(900,w/2)); setTimeout(()=>{ if(P&&!editMode) startCall(t,r); },w); return; }
 const lines=String(r.reply).split('\n').filter(s=>s.trim());
 let wait=Math.max(.4,Number(r.delay)||1.5)*1000;
 setTimeout(()=>{T.readUpTo[t.id]=my.id;T.typing=t.id;if(cur().id===t.id)renderChatLog();},Math.min(900,wait/2));
 lines.forEach((line,i)=>{
  setTimeout(()=>{
   (T.chats[t.id]||(T.chats[t.id]=[])).push({id:uid(),me:false,text:line,img:'',time});
   T.typing=i<lines.length-1?t.id:null; if(i===lines.length-1) delete T.readUpTo[t.id];
   if(cur().s==='thread'&&cur().id===t.id) renderChatLog(); else if(cur().s==='messages') renderScreen();
  },wait+i*Math.max(700,Math.min(2200,line.length*70)));
 });
}

/* ---------------- incoming call ---------------- */
let ringCtx=null, ringTimer=null, callTick=null;
function tone(f,at,d){const c=ringCtx,o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(.05,at+.02);g.gain.linearRampToValueAtTime(0,at+d);o.connect(g);g.connect(c.destination);o.start(at);o.stop(at+d+.03);}
function ringStart(){ try{ ringCtx=ringCtx||new (window.AudioContext||window.webkitAudioContext)(); if(ringCtx.resume) ringCtx.resume(); const play=()=>{const n=ringCtx.currentTime;[0,.28,.9,1.18].forEach((dt,i)=>tone(i%2?659:880,n+dt,.22));}; play(); ringTimer=setInterval(play,3000);}catch(e){} }
function ringStop(){ clearInterval(ringTimer); ringTimer=null; }
function stopCallTimers(){ ringStop(); clearInterval(callTick); callTick=null; const c=T.call; if(c){ clearTimeout(c.timeout); (c.timeouts||[]).forEach(clearTimeout); } }
function startCall(t,r){
 if(T.call) return;
 T.call={tid:t.id,state:'ring',lines:String(r.reply||'').split('\n').filter(x=>x.trim()),t0:0,shown:0,hung:false,timeouts:[]};
 T.call.timeout=setTimeout(()=>endCall('missed'),25000);
 ringStart(); renderScreen();
}
function acceptCall(){
 const c=T.call; if(!c||c.state!=='ring') return;
 ringStop(); clearTimeout(c.timeout); c.state='live'; c.t0=Date.now(); renderScreen();
 let at=1500;
 c.lines.forEach((l,i)=>{ c.timeouts.push(setTimeout(()=>{ if(T.call!==c) return; c.shown=i+1; updateCall(); },at)); at+=Math.max(1900,Math.min(4800,l.length*120)); });
 if(c.lines.length) c.timeouts.push(setTimeout(()=>{ if(T.call!==c) return; c.hung=true; updateCall(); c.timeouts.push(setTimeout(()=>{ if(T.call===c) endCall('done'); },1600)); },at+800));
 callTick=setInterval(updateCall,1000);
}
function endCall(kind){
 const c=T.call; if(!c) return;
 stopCallTimers(); T.call=null;
 const time=timeLabel(P.lock.time); const dur=c.t0?Math.round((Date.now()-c.t0)/1000):0;
 (T.chats[c.tid]||(T.chats[c.tid]=[])).push({id:uid(),date:true,text:c.state==='live'?`음성 통화 ${mmss(dur)} · ${time}`:(kind==='declined'?`거절한 전화 · ${time}`:`부재중 전화 · ${time}`)});
 renderScreen();
}
function callSubs(c){
 const ls=c.lines.slice(0,c.shown).slice(-3);
 return ls.map((l,i)=>`<p class="${i===ls.length-1?'now':''}">${esc(l)}</p>`).join('')+(c.hung?'<p class="hung">상대가 전화를 끊었어요</p>':'');
}
function updateCall(){
 const c=T.call; if(!c||c.state!=='live') return;
 const tm=$('#calltime'); if(tm) tm.textContent=c.hung?'통화 종료':mmss((Date.now()-c.t0)/1000);
 const sb=$('#callsubs'); if(sb) sb.innerHTML=callSubs(c);
}
S.call=()=>{

 const bg=t.avatar?`center/cover no-repeat url("${src(t.avatar)}")`:GRADS[hashIdx(t.name)%GRADS.length];
 const down=SV.phone.replace('<svg ','<svg style="transform:rotate(135deg)" ');
 if(c.state==='ring') return `<div class="call" style="background:${esc(bg)}"><div class="call-dim"></div><div class="call-in">

  <div class="call-top"><b class="call-name sm">${esc(t.name)}</b><span class="call-sub" id="calltime">${c.hung?'통화 종료':mmss((Date.now()-c.t0)/1000)}</span></div>

  <div class="call-grid">${['소리 끔','키패드','스피커','통화 추가','영상','연락처'].map(x=>`<div><span class="cg"></span><small>${x}</small></div>`).join('')}</div>

 /* music */
 playTrack:el=>{const id=el.dataset.id;if(curTrack()?.id!==id)setNow(id);T.playing=true;push({s:'player'});},
 togglePlay:(el,e)=>{e.stopPropagation();T.playing=!T.playing;renderScreen();},
 skip:el=>skip(+el.dataset.v),
 addTrack:()=>E.track({id:'t'+uid(),title:'',artist:'',cover:'',len:'3:30'},true),
 editTrack:el=>E.track(P.music.tracks.find(x=>x.id===el.dataset.id)),
 /* sns */
 editSns:()=>E.sns(),
 addPost:()=>E.post({id:uid(),img:'',caption:'',likes:0,date:'방금',comments:''},true),
 editPost:el=>E.post(P.sns.items.find(x=>x.id===el.dataset.id)),
 like:el=>{T.liked[el.dataset.id]=!T.liked[el.dataset.id];renderScreen();},
 follow:()=>{T.follow=!T.follow;renderScreen();},
 /* mail */
 openMail:el=>{T.read[el.dataset.id]=true;push({s:'mailitem',id:el.dataset.id});},
 addMail:el=>{const box=el.dataset.id||'inbox';E.mail({id:uid(),box,from:box==='sent'?'나':'',addr:box==='sent'?P.mail.address:'',to:box==='sent'?'':'나',subject:'',body:'',date:'방금',unread:box==='inbox'},true);},
 editMail:el=>E.mail(P.mail.items.find(x=>x.id===el.dataset.id)),
 editMailAcct:()=>openForm({title:'메일 계정',values:P.mail,fields:[{k:'name',l:'이름'},{k:'address',l:'메일 주소'}],onSave(v){P.mail.name=v.name;P.mail.address=v.address;}}),
 /* diary */
 addEntry:()=>{const e={id:uid(),date:P.lock.date,weather:'',mood:'',title:'',body:''};P.diary.items.unshift(e);route.push({s:'entry',id:e.id});commit();setTimeout(()=>$('.inplace.h')?.focus(),50);},
 editEntry:el=>E.entry(P.diary.items.find(x=>x.id===el.dataset.id)),
 diaryLock:()=>openForm({title:'일기장 잠금',values:{lock:P.diary.lock},fields:[{k:'lock',l:'일기장 비밀번호',num:true,max:8,ph:'비워 두면 잠그지 않아요',h:'보기 모드에서 일기 앱을 열 때 이 번호를 입력해야 해요.'}],onSave(v){P.diary.lock=String(v.lock||'').trim();}}),
 /* settings */
 editLock:()=>E.lock(), editHome:()=>E.home(), editInfo:()=>E.info(),
 editApp:el=>E.app(P.home.apps.find(x=>x.id===el.dataset.id)),
 /* sheets */
 shCancel:()=>{const s=SHEETS[SHEETS.length-1];if(s&&s.cancelDrop)s.cancelDrop();popSheet();if(P)renderScreen();},
 shSave:()=>{const s=SHEETS[SHEETS.length-1];s&&s.doSave&&s.doSave();},
 shDelete:()=>{const s=SHEETS[SHEETS.length-1];openConfirm('지우기','지우면 되돌릴 수 없어요.','지우기',()=>{s.onDelete();popSheet(2);commit();});},
 shYes:()=>{const s=SHEETS[SHEETS.length-1];s.yes();},
 shExtra:el=>{const s=SHEETS[SHEETS.length-1];s.extra[+el.dataset.i].fn();},
 leEdit:el=>{const s=SHEETS[SHEETS.length-1];s.onEdit(+el.dataset.i);},
 leMove:el=>{const s=SHEETS[SHEETS.length-1];const a=s.get();const i=+el.dataset.i,j=i+ +el.dataset.d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];commit();drawSheet();},
 leAdd:()=>{const s=SHEETS[SHEETS.length-1];s.onAdd();},
 pickImg:el=>{const k=el.dataset.k;pick(async files=>{toast('사진을 올리는 중…');const r=await uploadImage(files[0]);if(r){setFieldVal(k,r);toast('사진을 넣었어요. 저장을 눌러 주세요.');}});},
 clearImg:el=>setFieldVal(el.dataset.k,''),
 setSw:el=>setFieldVal(el.dataset.k,el.dataset.v)
};
function webSearch(q,fromHist){
 q=String(q||'').trim(); if(!q) return;
 if(!editMode&&!fromHist) T.history.push({id:uid(),text:q});
 const n=norm(q); const exact=P.web.pages.find(p=>norm(p.url)===n||norm(p.title)===n);
 if(exact) push({s:'webpage',id:exact.id}); else push({s:'websearch',q});
}
const F={
 send:f=>{const t=thread(f.dataset.id);const i=$('#chatin');const text=i.value.trim();if(!text)return;i.value='';
  if(editMode){t.msgs.push({id:uid(),me:T.sendAs==='me',text,img:'',time:timeLabel(P.lock.time)});touch();renderChatLog();}
  else sendTemp(t,text); i.focus();},
 websearch:()=>{const i=$('#addrin');webSearch(i.value);},
 diaryPin:()=>{const v=$('#diarypin').value;if(v===P.diary.lock){T.diaryOpen=true;T.shake=false;renderScreen();}else{T.shake=true;renderScreen();setTimeout(()=>{T.shake=false;},450);}}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el,e);}});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();F[f.dataset.form]?.(f);});
let bindT=null;
document.addEventListener('input',e=>{const el=e.target;
 if(el.classList.contains('cpick')){setFieldVal(el.dataset.k,el.value);return;}
 if(el.dataset.bind&&P){const [kind,id,field]=el.dataset.bind.split('|');const coll=kind==='note'?P.notes.items:P.diary.items;const o=coll.find(x=>x.id===id);if(o){o[field]=el.value;clearTimeout(bindT);bindT=setTimeout(touch,500);}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&SHEETS.length)A.shCancel();});
let swipeY=null;
document.addEventListener('pointerdown',e=>{swipeY=e.target.closest('.lock')?e.clientY:null;});
document.addEventListener('pointerup',e=>{if(swipeY!=null&&swipeY-e.clientY>40&&cur().s==='lock')unlock();swipeY=null;});

/* ---------------- boot ---------------- */
(async function boot(){
 if(STANDALONE&&!VIEWER&&isViewHash(location.hash.slice(1))){
  try{ const d=await unpackPhone(location.hash.slice(1)); VIEWER=true; READY=true; LOCAL=true; canWrite=false; PID='view'; P=normalize(d); document.title=P.name||document.title; render(); return; }
  catch(e){ $('#app').innerHTML='<main class="lib"><div class="empty"><b>링크를 열 수 없어요</b>링크가 중간에 잘렸거나 이 브라우저가 너무 오래됐어요. 링크 전체를 다시 복사해서 열어 보세요.</div></main>'; return; }
 }
 if(VIEWER){ READY=true; LOCAL=true; canWrite=false; PID='view'; P=normalize(clone(VIEWER_DATA)); document.title=P.name||document.title; render(); return; }
 render();
 const C=STANDALONE?null:window.claude; const use=n=>C&&C.use?C.use(n).catch(()=>null):Promise.resolve(null);
 const [db,assets,user]=await Promise.all([use('db'),use('assets'),use('user')]);
 DB=db; ASSETS=assets; USER=user; READY=true;
 if(!DB){ LOCAL=true; canWrite=false; }
 else { let c=null; try{ c=USER?await USER.can('data.write'):null; }catch(e){} canWrite=c!==false; }
 if(DB){ unsubList=DB.collection('phones').orderBy('updatedAt','desc').limit(300).onSnapshot(s=>{LIST=s.docs.map(d=>({id:d.id,...d.data()}));if(!PID)renderList();},()=>{LIST=LIST||[];if(!PID)renderList();}); }
 const h=readHash(); if(h) openPhoneId(h); else render();
 window.addEventListener('storage',e=>{ if(e.key===LKEY){ try{LOCALP=JSON.parse(e.newValue||'{}')||{};}catch(_){} if(!PID) renderList(); } });
})();
</script>
